name: Phase 1 Validation

on:
  push:
    branches:
      - phase1-auth-subscriptions
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Publish Typecheck status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.typecheck.outcome }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === 'success' ? 'success' : 'failure',
              context: 'PHASE1 / Typecheck',
              description: outcome === 'success' ? 'npm run typecheck passed' : 'npm run typecheck failed or was skipped'
            });

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Publish Lint status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.lint.outcome }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === 'success' ? 'success' : 'failure',
              context: 'PHASE1 / Lint',
              description: outcome === 'success' ? 'npm run lint passed' : 'npm run lint failed or was skipped'
            });

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Publish Build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.build.outcome }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === 'success' ? 'success' : 'failure',
              context: 'PHASE1 / Build',
              description: outcome === 'success' ? 'npm run build passed' : 'npm run build failed or was skipped'
            });

      - name: Fail validation if any check failed
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
