name: Phase 2 Validation

on:
  push:
    branches:
      - phase2-academic-structure
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Auth regression tests
        id: auth_tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:auth

      - name: Subscription regression tests
        id: subscription_tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:subscriptions

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Publish Phase 2 statuses
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const checks = [
              ['Academic / Auth Regression', '${{ steps.auth_tests.outcome }}'],
              ['Academic / Subscription Regression', '${{ steps.subscription_tests.outcome }}'],
              ['Academic / Typecheck', '${{ steps.typecheck.outcome }}'],
              ['Academic / Lint', '${{ steps.lint.outcome }}'],
              ['Academic / Build', '${{ steps.build.outcome }}'],
            ];
            for (const [name, outcome] of checks) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: outcome === 'success' ? 'success' : 'failure',
                context: `PHASE2 / ${name}`,
                description: outcome === 'success' ? `${name} passed` : `${name} failed or was skipped`
              });
            }

      - name: Fail validation if any check failed
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.auth_tests.outcome }}" = "success"
          test "${{ steps.subscription_tests.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
