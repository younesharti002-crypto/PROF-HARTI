name: PWA QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "public/manifest.webmanifest"
      - "public/sw.js"
      - "public/icons/**"
      - "src/components/pwa/**"
      - "src/app/[lang]/layout.tsx"
      - ".github/workflows/pwa-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret
      DATABASE_URL: postgresql://user:password@localhost:5432/prof_harti_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regression tests
        run: npm run test:qa

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
